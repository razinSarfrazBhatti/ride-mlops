
name: Ride MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  python-tests:
    name: Python API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Python tests
        run: python -m pytest -v

  go-tests:
    name: Go Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Run Go tests
        working-directory: go-backend
        run: go test ./...

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python API image
        run: docker build -t ride-fare-api:ci .

      - name: Build Go backend image
        run: docker build -t ride-go-backend:ci ./go-backend
  
  publish-images:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - go-tests
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Python API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/razinsarfrazbhatti/ride-fare-api:latest
            ghcr.io/razinsarfrazbhatti/ride-fare-api:${{ github.sha }}

      - name: Build and push Go backend image
        uses: docker/build-push-action@v6
        with:
          context: ./go-backend
          push: true
          tags: |
            ghcr.io/razinsarfrazbhatti/ride-go-backend:latest
            ghcr.io/razinsarfrazbhatti/ride-go-backend:${{ github.sha }}

