services:
  mlflow:
    image: python:3.9-slim
    container_name: ride-mlflow
    working_dir: /app
    volumes:
      - ./mlruns:/mlruns
    command: >
      sh -c "pip install --no-cache-dir mlflow==3.1.4 &&
      mlflow server
      --backend-store-uri file:///mlruns
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"
    networks:
      - ride-network

  ml-api:
    image: ghcr.io/razinsarfrazbhatti/ride-fare-api:latest
    container_name: ride-ml-api
    environment:
      MODEL_STORE: /models
      MODEL_VERSION: "2"
    volumes:
      - ./deployment/model-store:/models:ro
    ports:
      - "8000:8000"
    networks:
      - ride-network

  go-backend:
    image: ghcr.io/razinsarfrazbhatti/ride-go-backend:latest
    container_name: ride-go-backend
    depends_on:
      - ml-api
    ports:
      - "8081:8081"
    networks:
      - ride-network

networks:
  ride-network:
    driver: bridge